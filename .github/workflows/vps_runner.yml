name: AbsoraCloud Bare-Metal VPS Node

on:
  workflow_dispatch:
    inputs:
      target_user_id:
        description: 'Target User ID'
        required: true
        default: 'usr_demo_vps'
      git_repo_url:
        description: 'Git Auto-Sync Repository'
        required: false
        default: ''

jobs:
  run-vps-node:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max GitHub Action limit

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python & Tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Cloudflared
        run: |
          pip install requests websockets
          sudo apt-get update && sudo apt-get install -y ttyd
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start TTYD Terminal Server
        run: |
          ttyd -p 7681 bash &
          sleep 2

      - name: Create Cloudflare Quick Tunnel & Launch Absora VPS Daemon
        env:
          RENDER_SERVER_URL: 'https://absoracloud.onrender.com'
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          TARGET_USER_ID: ${{ github.event.inputs.target_user_id }}
          GIT_REPO_URL: ${{ github.event.inputs.git_repo_url }}
        run: |
          # Start cloudflared quick tunnel in background and capture log
          cloudflared tunnel --url http://localhost:7681 > cloudflared.log 2>&1 &
          sleep 5
          
          # Extract generated trycloudflare.com tunnel URL
          TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' cloudflared.log | head -n 1)
          if [ -n "$TUNNEL_URL" ]; then
            WSS_URL=$(echo $TUNNEL_URL | sed 's/https/wss/')
            echo "Cloudflare Quick Tunnel Created: $WSS_URL"
            export CLOUDFLARE_TUNNEL_URL="$WSS_URL"
          fi

          CLOUDFLARE_TUNNEL_URL="$WSS_URL" python workers/github_vps/daemon.py
