<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Absoracloud - Authentication Portal</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-secondary": "#ffffff",
            "on-primary": "#ffffff",
            "secondary": "#5f5e5b",
            "surface": "#fdf8f8",
            "surface-container-low": "#f7f3f2",
            "surface-container": "#f1edec",
            "surface-container-high": "#ebe7e6",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#1c1b1b",
            "warm-gray": "#8C8984",
            "surface-bright": "#fdf8f8",
            "on-surface-variant": "#444748",
            "primary": "#000000",
            "on-background": "#1c1b1b",
            "background": "#fdf8f8",
            "border-muted": "#E5E1DA",
            "charcoal-text": "#1A1A1A"
          },
          "fontFamily": {
            "body-md": ["Inter"],
            "headline-md": ["Sora"],
            "display-lg": ["Sora"],
            "label-sm": ["Inter"]
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex items-center justify-center p-6 antialiased">
  
  <div class="w-full max-w-md bg-surface-container-lowest border border-border-muted rounded-xl p-8 shadow-sm">
    <div class="text-center mb-8">
      <a href="/" class="font-headline-md text-headline-md font-bold text-primary tracking-tight block mb-2">Absoracloud</a>
      <p class="font-body-md text-sm text-on-surface-variant">Single Sign-On Cloud Authentication</p>
    </div>

    <!-- Tab Switcher -->
    <div class="flex bg-surface-container rounded-lg p-1 mb-6">
      <button class="flex-1 py-2 font-label-sm text-label-sm font-semibold rounded-md bg-surface-container-lowest text-primary shadow-xs transition-all" id="tabLoginBtn" onclick="switchTab('login')">Sign In</button>
      <button class="flex-1 py-2 font-label-sm text-label-sm font-semibold rounded-md text-on-surface-variant transition-all" id="tabRegisterBtn" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block font-label-sm text-xs text-on-surface-variant uppercase tracking-wider mb-2">Email Address</label>
        <input type="email" id="loginEmail" required placeholder="user@domain.com" class="w-full bg-surface-container border border-border-muted text-on-surface rounded-lg px-4 py-3 focus:outline-none focus:border-primary transition-all" />
      </div>
      <div>
        <label class="block font-label-sm text-xs text-on-surface-variant uppercase tracking-wider mb-2">Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-surface-container border border-border-muted text-on-surface rounded-lg px-4 py-3 focus:outline-none focus:border-primary transition-all" />
      </div>
      <button type="submit" class="w-full bg-charcoal-text text-surface-container-lowest font-label-sm text-label-sm py-3 rounded-lg hover:opacity-90 transition-opacity">
        Sign In to Console
      </button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" class="space-y-4 hidden">
      <div>
        <label class="block font-label-sm text-xs text-on-surface-variant uppercase tracking-wider mb-2">Username</label>
        <input type="text" id="regUsername" required placeholder="clouduser" class="w-full bg-surface-container border border-border-muted text-on-surface rounded-lg px-4 py-3 focus:outline-none focus:border-primary transition-all" />
      </div>
      <div>
        <label class="block font-label-sm text-xs text-on-surface-variant uppercase tracking-wider mb-2">Email Address</label>
        <input type="email" id="regEmail" required placeholder="user@domain.com" class="w-full bg-surface-container border border-border-muted text-on-surface rounded-lg px-4 py-3 focus:outline-none focus:border-primary transition-all" />
      </div>
      <div>
        <label class="block font-label-sm text-xs text-on-surface-variant uppercase tracking-wider mb-2">Password</label>
        <input type="password" id="regPassword" required placeholder="••••••••" class="w-full bg-surface-container border border-border-muted text-on-surface rounded-lg px-4 py-3 focus:outline-none focus:border-primary transition-all" />
      </div>
      <button type="submit" class="w-full bg-charcoal-text text-surface-container-lowest font-label-sm text-label-sm py-3 rounded-lg hover:opacity-90 transition-opacity">
        Create Cloud Account
      </button>
    </form>

    <div class="mt-6 text-center font-body-md text-xs" id="msgBox"></div>
  </div>

  <script>
    const RENDER_URL = 'https://absoracloud.onrender.com';

    function switchTab(tab) {
      document.getElementById('msgBox').innerText = '';
      const loginBtn = document.getElementById('tabLoginBtn');
      const regBtn = document.getElementById('tabRegisterBtn');

      if (tab === 'login') {
        loginBtn.className = 'flex-1 py-2 font-label-sm text-label-sm font-semibold rounded-md bg-surface-container-lowest text-primary shadow-xs transition-all';
        regBtn.className = 'flex-1 py-2 font-label-sm text-label-sm font-semibold rounded-md text-on-surface-variant transition-all';
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
      } else {
        regBtn.className = 'flex-1 py-2 font-label-sm text-label-sm font-semibold rounded-md bg-surface-container-lowest text-primary shadow-xs transition-all';
        loginBtn.className = 'flex-1 py-2 font-label-sm text-label-sm font-semibold rounded-md text-on-surface-variant transition-all';
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgBox = document.getElementById('msgBox');
      msgBox.className = 'mt-6 text-center font-body-md text-xs text-on-surface-variant';
      msgBox.innerText = 'Verifying credentials...';

      try {
        const res = await fetch(`${RENDER_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
          })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('absora_jwt', data.token);
          localStorage.setItem('absora_user', JSON.stringify(data.user));
          msgBox.className = 'mt-6 text-center font-body-md text-xs text-emerald-600 font-semibold';
          msgBox.innerText = 'Authentication successful! Redirecting...';
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 1000);
        } else {
          msgBox.className = 'mt-6 text-center font-body-md text-xs text-red-600 font-semibold';
          msgBox.innerText = data.error || 'Login failed';
        }
      } catch (err) {
        msgBox.className = 'mt-6 text-center font-body-md text-xs text-red-600 font-semibold';
        msgBox.innerText = 'Connection error to Render server.';
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msgBox = document.getElementById('msgBox');
      msgBox.className = 'mt-6 text-center font-body-md text-xs text-on-surface-variant';
      msgBox.innerText = 'Creating cloud account...';

      try {
        const res = await fetch(`${RENDER_URL}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('regUsername').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value
          })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('absora_jwt', data.token);
          localStorage.setItem('absora_user', JSON.stringify(data.user));
          msgBox.className = 'mt-6 text-center font-body-md text-xs text-emerald-600 font-semibold';
          msgBox.innerText = 'Account created! Redirecting to Dashboard...';
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 1000);
        } else {
          msgBox.className = 'mt-6 text-center font-body-md text-xs text-red-600 font-semibold';
          msgBox.innerText = data.error || 'Registration failed';
        }
      } catch (err) {
        msgBox.className = 'mt-6 text-center font-body-md text-xs text-red-600 font-semibold';
        msgBox.innerText = 'Connection error to Render server.';
      }
    });
  </script>
</body>
</html>
