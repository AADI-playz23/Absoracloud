services:
  - type: web
    name: absoracloud-backend-server
    env: node
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: JWT_PEPPER
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: D1_DB_1_ID
        sync: false
      - key: UPSTASH_REDIS_A_URL
        sync: false
      - key: UPSTASH_REDIS_A_TOKEN
        sync: false
      - key: UPSTASH_REDIS_B_URL
        sync: false
      - key: UPSTASH_REDIS_B_TOKEN
        sync: false
